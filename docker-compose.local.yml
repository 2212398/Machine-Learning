# Local-only overrides for docker-compose.yml
# Usage (from repo root):
#   docker compose -f .\code\docker-compose.yml -f .\code\docker-compose.local.yml --env-file .\.env up -d --build backend frontend

services:
  backend:
    ports:
      - "8000:8000"

  frontend:
    ports:
      - "3000:3000"
