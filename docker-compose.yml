services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8000"
    environment:
      DEVICE: ${DEVICE:-cpu}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      RECOMMENDATION_PATH: /app/backend/app/labels/recommendations_vi.json
      PLANT_MODEL_PATH: /app/backend/app/models/plant_efficientnet_b4.pt
      DISEASE_MODEL_PATH: /app/backend/app/models/disease_efficientnet_b4.pt
      PLANT_BACKBONE: efficientnet_b4
      DISEASE_BACKBONE: efficientnet_b4
    volumes:
      - ./backend/app/models:/app/backend/app/models:ro
      - ./backend/app/labels:/app/backend/app/labels:ro
      - ./backend/app/upload_archive:/app/backend/app/upload_archive
      - ./training/retraining_exports:/app/training/retraining_exports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_FASTAPI_URL: http://backend:8000
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: plantleaf_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    # entrypoint removed so we can run certbot commands via
    # `docker compose run --rm certbot "certonly ..."` as needed
    # Use 'docker compose run --rm certbot "certonly --webroot --webroot-path=/var/www/certbot -d <your-domain> --email <you@example.com> --agree-tos --no-eff-email"' to obtain certs
    restart: "no"

  certbot-renew:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot || true; sleep 43200; done"]
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
