services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8000"
    environment:
      DEVICE: ${DEVICE:-cpu}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      RECOMMENDATION_PATH: /app/backend/app/labels/recommendations_vi.json
      PLANT_MODEL_PATH: /app/backend/app/models/plant_mobilenetv3.pt
      DISEASE_MODEL_PATH: /app/backend/app/models/disease_mobilenetv3.pt
    volumes:
      - ./backend/app/models:/app/backend/app/models:ro
      - ./backend/app/labels:/app/backend/app/labels:ro
      - ./backend/app/upload_archive:/app/backend/app/upload_archive
      - ./training/retraining_exports:/app/training/retraining_exports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_FASTAPI_URL: ${NEXT_PUBLIC_FASTAPI_URL:-http://backend:8000}
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_FASTAPI_URL: ${NEXT_PUBLIC_FASTAPI_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    # entrypoint removed so we can run certbot commands via
    # `docker compose run --rm certbot "certonly ..."` as needed
    # Use 'docker compose run --rm certbot "certonly --webroot --webroot-path=/var/www/certbot -d <your-domain> --email <you@example.com> --agree-tos --no-eff-email"' to obtain certs
    restart: "no"

  certbot-renew:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot || true; sleep 43200; done"]
    restart: unless-stopped
